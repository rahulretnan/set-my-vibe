name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.20.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run audit:public
      - run: bash -n install.sh scripts/release.sh
      - name: Verify the packaged picker
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release.sh
          release_dir=$(mktemp -d)
          tar -xzf dist/set-my-vibe.tar.gz -C "$release_dir"
          cd "$release_dir/set-my-vibe"
          node --input-type=module -e "await import('./lib/picker.mjs')"
          node bin/set-my-vibe.mjs --version
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
